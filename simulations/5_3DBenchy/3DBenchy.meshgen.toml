[mesh]
output_folder = "."
output_filename = "vial_r2000_h5000_15um.vtk"
append_hmax = false

# Geometry controls
rmax = 200.0 # [10 μm]
length = 500.0 # [10 μm]
length_axis = "z" # one of: x, y, z

# General target mesh size (used to derive circumferential resolution and dz)
mesh_size = 1.5 # [10 μm]

# Optional explicit angular resolution override:
# h = 48

# Optional overrides for legacy defaults:
rbase = 180.0 # [10 μm]
#nr = 6
tune_transition = true # auto-balance square/transition/outer region sizes
shift = [0.0, 0.0, 0.0]

# Axial discretization
axial_mode = "mesh_size"


[fields]
write = false
